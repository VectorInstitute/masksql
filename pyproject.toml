[project]
name = "masksql"
version = "0.1.0"
description = "MaskSQL: Safeguarding Privacy for LLM-Based Text-to-SQL via Abstraction"
readme = "README.md"
authors = [{ name = "Vector AI Engineering", email = "ai_engineering@vectorinstitute.ai" }]
license = "Apache-2.0"
repository = "https://github.com/VectorInstitute/masksql"
requires-python = ">=3.11"
dependencies = [
    "filelock>=3.20.3", # Pinning version to address vulnerabilities CVE-2025-68146, CVE-2026-22701
    "idna>=3.15", # Pinning version to address vulnerability CVE-2026-45409
    "fonttools>=4.60.2", # Pinning version to address vulnerability GHSA-768j-98cg-p3fv
    "msgpack>=1.2.1", # Pinning version to address vulnerability GHSA-6v7p-g79w-8964
    "pillow>=12.2.0", # Pinning version to address vulnerabilities CVE-2026-25990, PYSEC-2026-165, CVE-2026-40192, CVE-2026-42309, CVE-2026-42310, CVE-2026-42311
    "pygments>=2.20.0", # Pinning version to address vulnerability CVE-2026-4539
    "tornado>=6.5.7", # Pinning version to address vulnerabilities GHSA-78cv-mqj4-43f7, CVE-2026-31958, CVE-2026-49854, CVE-2026-49853, CVE-2026-49855, GHSA-pw6j-qg29-8w7f
    "werkzeug>=3.1.6", # Pinning version to address vulnerabilities GHSA-hgf8-39gv-g3f2, CVE-2026-21860, CVE-2026-27199
    "virtualenv>=20.36.2", # Pinning version to address CVE-2026-22702
    "absl-py>=2.3.1",
    "python-dotenv>=1.2.2", # Pinning version to address vulnerability CVE-2026-28684
    "func-timeout>=4.3.5",
    "hf-xet>=1.1.5",
    "huggingface-hub>=0.33.2",
    "matplotlib>=3.7.5",
    "natsort>=8.4.0",
    "nltk>=3.9.4", # Pinning version to address vulnerabilities GHSA-469j-vmhf-r6v7, GHSA-7p94-766c-hgjp, GHSA-gfwx-w7gr-fvh7, GHSA-jm6w-m3j8-898g, GHSA-rf74-v2fm-23pw
    "numpy>=1.24.4,<2.0.0",
    "openai>=1.93.0",
    "pytest>=9.0.3", # Pinning version to address vulnerability CVE-2025-71176
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pandas>=2.2.3",
    "protobuf>=3.20.3",
    "psutil>=7.0.0",
    "pydantic>=2.10.6",
    "pyyaml>=6.0.2",
    "rapidfuzz>=3.9.7",
    "requests>=2.33.0", # Pinning version to address vulnerability CVE-2026-25645
    "rich>=13.9.4",
    "scikit-learn>=1.5.0",
    "scipy>=1.10.1",
    "seaborn>=0.13.2",
    "spacy>=3.7.0",
    "sql-metadata>=2.15.0",
    "sqlparse>=0.5.3",
    "tensorboard>=2.8.0",
    "tokenizers>=0.13.3",
    "torch>=2.12.0", # Pinning version to address vulnerability CVE-2025-3001
    "tqdm>=4.67.1",
    "transformers>=5.3.0", # Pinning version to address vulnerabilities CVE-2026-1839, CVE-2026-4372
    "vcrpy>=8.2.1", # Pinning version to address vulnerability GHSA-rpj2-4hq8-938g
    "ply>=3.11",
    "urllib3>=2.7.0", # Pinning version to address vulnerabilities PYSEC-2026-141, PYSEC-2026-142
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "codecov>=2.1.13",
    "mypy>=1.14.1",
    "nbqa>=1.9.1",
    "pip>=26.1.2", # Pinning version to address vulnerabilities GHSA-4xh5-x5gv-qwph, CVE-2026-1703, PYSEC-2026-196, CVE-2026-3219, CVE-2026-6357
    "pip-audit>=2.7.3",
    "pre-commit>=4.1.0",
    "pytest>=9.0.3", # Pinning version to address vulnerability CVE-2025-71176
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.2",
]
docs = [
    "jinja2>=3.1.6", # Pinning version to address vulnerability GHSA-cpwx-vrp4-4pq7
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.15",
    "pymdown-extensions>=11.0.1", # Pinning version to address vulnerability CVE-2026-46338
    "mkdocstrings>=0.24.1",
    "mkdocstrings-python>=1.10.0",
    "ipykernel>=6.29.5",
    "ipython>=8.31.0",
]

# Default dependency groups to be installed
[tool.uv]
default-groups = ["dev", "docs"]

[tool.mypy]
follow_imports = "normal"
exclude = [
    "resdsql/"
]
ignore_missing_imports = false
install_types = true
pretty = true
non_interactive = true
allow_untyped_defs = false
no_implicit_optional = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
allow_subclassing_any = false
allow_untyped_calls = false
allow_incomplete_defs = false
allow_untyped_decorators = false
warn_redundant_casts = true
warn_unused_ignores = true
implicit_reexport = false
strict_equality = true
extra_checks = true

[tool.ruff]
include = ["*.py", "pyproject.toml", "*.ipynb"]
exclude = []
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "A", # flake8-builtins
    "B", # flake8-bugbear
    "COM", # flake8-commas
    "C4", # flake8-comprehensions
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ICN", # flake8-import-conventions
    "Q", # flake8-quotes
    "RSE", # flake8-raise
    "D", # pydocstyle
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "W", # pycodestyle
    "N", # pep8-naming
    "ERA", # eradicate
    "PL", # pylint
]
fixable = ["A", "B", "COM", "C4", "RET", "SIM", "ICN", "Q", "RSE", "D", "E", "F", "I", "W", "N", "ERA", "PL"]
ignore = [
    "B905", # `zip()` without an explicit `strict=` parameter
    "E501", # line too long
    "D203", # 1 blank line required before class docstring
    "D213", # Multi-line docstring summary should start at the second line
    "PLR2004", # Replace magic number with named constant
    "PLR0913", # Too many arguments
    "COM812", # Missing trailing comma
    "ERA001", # Found commented-out code (too many false positives with math comments)
    "A001", # Ignore variable `input` is shadowing a Python builtin (common for torch)
    "A002", # Ignore variable `input` is shadowing a Python builtin in function (common for torch)
    "D301", # r-strings for docstrings with backslashes
    "E711", # comparison to None should be 'if cond is None:'
]

# Ignore import violations in all `__init__.py` files.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]
# Ignoring undocumented public functions, public init, magic method, and magic numbers in tests folder
"tests/*" = ["D103", "D105", "D107"]


[tool.ruff.lint.pep8-naming]
ignore-names = ["X*", "setUp"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.pytest.ini_options]
markers = [
    "integration_test: marks tests as integration tests",
]

[tool.coverage]
[tool.coverage.run]
source = ["src/"]
omit = ["tests/*", "*__init__.py"]

[tool.typos.files]
extend-exclude = ["src/taxonomy/parse/parsetab.py"]

[tool.typos.default.extend-words]
ot = "ot"
